[package]
name = "x4mp-transform-ffi"
description = "C ABI over x4mp-transform for the in-game view-cache shadow (loaded by x4lan_xform_64.dll; no hooks of its own)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "x4mp_transform_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
x4mp-transform = { path = ".." }
