[package]
name = "x4mp-economy"
description = "Per-sector economy model for the engine rewrite: production cycles, storage, trade offers, reservations; capture/replay against the original engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "x4mp_economy"
crate-type = ["rlib"]

[[bin]]
name = "x4mp-econ-replay"
path = "src/bin/x4mp-econ-replay.rs"

[dependencies]
# Per-sector ECS core (ids, engine RNG, scheduler, bus, shadow compare): rewrite-coord/interfaces.md.
x4mp-sim = { path = "../x4mp-sim" }
