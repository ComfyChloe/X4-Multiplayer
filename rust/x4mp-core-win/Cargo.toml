[package]
name = "x4mp-core-win"
description = "Windows cdylib exposing x4mp-core through a build-pinned C ABI (no hooks of its own)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "x4mp_core_win"
crate-type = ["cdylib", "rlib"]

[dependencies]
x4mp-core = { path = "../x4mp-core" }
